name: Release

# Publishes downloadable binaries to a GitHub Release:
#   - voxwin.apk           (Android, release-signed)   → phone
#   - voxwin-daemon.exe    (Windows daemon, release)   → PC
#
# Trigger: push a tag like v0.2.0, or run manually ("Run workflow") with a tag.
# See docs/RELEASING.md for the one-time keystore + secrets setup.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to publish (e.g. v0.2.0). Must already exist or will be created on the current commit."
        required: true

permissions:
  contents: write

jobs:
  daemon:
    name: Build Windows daemon (release)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-daemon
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-daemon

      - name: Build (release)
        run: cargo build --release

      - name: Stage exe
        shell: bash
        run: |
          mkdir -p ../dist
          cp target/release/voxwin-daemon.exe ../dist/voxwin-daemon.exe

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon
          path: dist/voxwin-daemon.exe
          if-no-files-found: error

  app:
    name: Build Android APK (release-signed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md to configure signing secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voxwin-release.jks"

      - name: Assemble release APK (signed)
        env:
          VOXWIN_KEYSTORE_FILE: ${{ runner.temp }}/voxwin-release.jks
          VOXWIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VOXWIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VOXWIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage apk
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/voxwin.apk

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/voxwin.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [daemon, app]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p dist
          cp artifacts/daemon/voxwin-daemon.exe dist/
          cp artifacts/app/voxwin.apk dist/
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/voxwin-daemon.exe
            dist/voxwin.apk
