name: CI

# Builds both halves of voxwin on clean, hosted runners:
#   - windows-daemon: Rust, compiled + tested on a real Windows (MSVC) runner
#   - android:        Kotlin/Compose app, unit-tested + assembled on Linux
#
# (Local dev machines under enterprise Defender may block running freshly
# compiled native binaries; these hosted runners are the authoritative build
# signal for the Rust side.)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-daemon:
    name: Rust daemon (Windows / MSVC)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-daemon
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-daemon

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --release --all-targets

      - name: Build (release)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo build --release 2>&1 | tee build_out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -aE "error(\[|:)" build_out.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::rustc build failed:%0A${msg:-<no error lines matched; see tail>%0A$(tail -40 build_out.txt | sed ':a;N;$!ba;s/\n/%0A/g')}"
          fi
          exit "$code"

      - name: Test
        run: cargo test --release

      - name: Upload daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: voxwin-daemon-exe
          path: windows-daemon/target/release/voxwin-daemon.exe
          if-no-files-found: error

  android:
    name: Android app (unit tests + APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK pre-installed at $ANDROID_HOME
      # (platform android-34 + build-tools, licenses pre-accepted). We rely on
      # that instead of android-actions/setup-android, which broke under the
      # Node-20 → Node-24 forced-runtime deprecation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voxwin-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
